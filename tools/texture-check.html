<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>texture-check</title>
  <style>
    body { background: #111; color: #ddd; font: 12px/1.4 monospace; margin: 8px; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <pre id="out">running…</pre>
  <script type="module">
    const out = document.getElementById('out');
    const lines = [];
    const log = (s = '') => { lines.push(String(s)); out.textContent = lines.join('\n'); };

    try {
      const mod = await import('../src/render/textures.js');
      const {
        TILE_PX, ATLAS_COLS, ATLAS_ROWS, TEXTURE_NAMES, TILE_INDEX,
        generateAtlas, generateTileCanvas,
      } = mod;

      const fail = [];
      const check = (cond, msg) => { if (!cond) fail.push(msg); };

      log(`TILE_PX=${TILE_PX} ATLAS_COLS=${ATLAS_COLS} ATLAS_ROWS=${ATLAS_ROWS}`);
      log(`TEXTURE_NAMES.length=${TEXTURE_NAMES.length} capacity=${ATLAS_COLS * ATLAS_ROWS}`);

      // ---- structural assertions -------------------------------------------------
      check(TILE_PX === 16, `TILE_PX should be 16, got ${TILE_PX}`);
      check(TEXTURE_NAMES.length <= ATLAS_COLS * ATLAS_ROWS,
        `TEXTURE_NAMES.length ${TEXTURE_NAMES.length} exceeds atlas capacity ${ATLAS_COLS * ATLAS_ROWS}`);
      check(new Set(TEXTURE_NAMES).size === TEXTURE_NAMES.length,
        'TEXTURE_NAMES contains duplicates');

      const atlas = generateAtlas();
      check(atlas.canvas.width === ATLAS_COLS * TILE_PX,
        `canvas width ${atlas.canvas.width} != ${ATLAS_COLS * TILE_PX}`);
      check(atlas.canvas.height === ATLAS_ROWS * TILE_PX,
        `canvas height ${atlas.canvas.height} != ${ATLAS_ROWS * TILE_PX}`);
      check(atlas.size === ATLAS_COLS * TILE_PX, `size ${atlas.size} unexpected`);
      check(atlas.columns === ATLAS_COLS && atlas.rows === ATLAS_ROWS && atlas.tilePx === TILE_PX,
        'columns/rows/tilePx mismatch');
      check(atlas.canvas instanceof HTMLCanvasElement, 'atlas.canvas is not an HTMLCanvasElement');

      // indexByName must be unique and match TEXTURE_NAMES order
      const idxVals = TEXTURE_NAMES.map((n) => atlas.indexByName[n]);
      check(idxVals.every((v, i) => v === i), 'indexByName is not in TEXTURE_NAMES order');
      check(new Set(idxVals).size === TEXTURE_NAMES.length, 'indexByName indices are not unique');
      check(Object.keys(atlas.indexByName).length === TEXTURE_NAMES.length,
        'indexByName has wrong key count');

      // every tile gets a distinct cell
      const cells = new Set(idxVals.map((i) => `${Math.floor(i / ATLAS_COLS)},${i % ATLAS_COLS}`));
      check(cells.size === TEXTURE_NAMES.length, 'tile cells collide');

      // TILE_INDEX populated by generateAtlas
      check(TILE_INDEX.stone === 0, `TILE_INDEX.stone should be 0, got ${TILE_INDEX.stone}`);
      check(Object.keys(TILE_INDEX).length === TEXTURE_NAMES.length, 'TILE_INDEX not fully populated');

      // ---- determinism -----------------------------------------------------------
      const a2 = generateAtlas();
      const ctxA = atlas.canvas.getContext('2d');
      const ctxB = a2.canvas.getContext('2d');
      const pxA = ctxA.getImageData(0, 0, atlas.canvas.width, atlas.canvas.height).data;
      const pxB = ctxB.getImageData(0, 0, a2.canvas.width, a2.canvas.height).data;
      let diff = 0;
      for (let i = 0; i < pxA.length; i++) if (pxA[i] !== pxB[i]) diff++;
      check(diff === 0, `generateAtlas() is not deterministic: ${diff} differing bytes`);

      // ---- per-tile pixel readback ----------------------------------------------
      const ctx = atlas.canvas.getContext('2d');
      log('');
      log('name                    idx  cell     opaque  transp  colors  flags');

      const stats = {};
      for (let i = 0; i < TEXTURE_NAMES.length; i++) {
        const name = TEXTURE_NAMES[i];
        const row = Math.floor(i / ATLAS_COLS);
        const col = i % ATLAS_COLS;
        const img = ctx.getImageData(col * TILE_PX, row * TILE_PX, TILE_PX, TILE_PX).data;
        let opaque = 0, transp = 0, partial = 0;
        const colors = new Set();
        for (let p = 0; p < img.length; p += 4) {
          const a = img[p + 3];
          if (a === 255) opaque++;
          else if (a === 0) transp++;
          else partial++;
          if (a === 255) colors.add(`${img[p]},${img[p + 1]},${img[p + 2]}`);
        }
        const flags = [];
        if (partial > 0) flags.push('partial-alpha');
        if (name === 'glass' || name === 'torch' || name === 'oak_leaves') flags.push('needs-alpha');
        stats[name] = { opaque, transp, partial, colors: colors.size, img: img.slice() };
        log(
          `${name.padEnd(22)} ${String(i).padStart(3)}  ${row},${String(col).padStart(2)}  ` +
          `${String(opaque).padStart(6)}  ${String(transp).padStart(6)}  ${String(colors.size).padStart(6)}  ${flags.join(' ')}`
        );

        // every tile must be non-empty
        check(opaque > 0, `${name}: no opaque pixels`);

        // alpha discipline
        const alphaAllowed = [
          'glass', 'torch', 'oak_leaves', 'sugar_cane', 'dead_bush', 'rail',
          'dandelion', 'poppy',
        ].includes(name);
        if (!alphaAllowed) {
          check(transp === 0 && partial === 0, `${name}: must be fully opaque (alpha 0 count ${transp})`);
        }
        check(partial === 0, `${name}: has partial alpha ${partial} (renderer uses alpha-test)`);
      }

      // ---- specific content assertions ------------------------------------------
      log('');
      log('--- targeted assertions ---');
      const ta = (cond, msg) => { check(cond, msg); log(`${cond ? 'ok  ' : 'FAIL'}  ${msg}`); };

      for (const n of ['glass', 'torch', 'oak_leaves']) {
        ta(stats[n].transp > 0, `${n}: has transparent pixels (${stats[n].transp})`);
      }
      ta(stats.glass.transp >= 150, `glass: mostly transparent (${stats.glass.transp}/256)`);
      // Glass must be see-through in the middle: only a border frame, no filled pane.
      {
        const gi = stats.glass.img;
        let interiorOpaque = 0;
        for (let y = 2; y < 14; y++) {
          for (let x = 2; x < 14; x++) {
            if (gi[(y * TILE_PX + x) * 4 + 3] === 255) interiorOpaque++;
          }
        }
        ta(interiorOpaque <= 20,
          `glass: interior transparent (only ${interiorOpaque}/144 interior pixels fully opaque)`);
      }
      ta(stats.torch.transp >= 120, `torch: mostly transparent (${stats.torch.transp}/256)`);

      ta(stats.stone.colors >= 3, `stone: >=3 unique colors (${stats.stone.colors})`);
      ta(stats.dirt.colors >= 3, `dirt: >=3 unique colors (${stats.dirt.colors})`);

      // ore colors: tile must contain pixels close to the ore hue
      const near = (name, target, tol) => {
        const img = stats[name].img;
        let best = Infinity, hits = 0;
        for (let p = 0; p < img.length; p += 4) {
          if (img[p + 3] !== 255) continue;
          const d = Math.abs(img[p] - target[0]) + Math.abs(img[p + 1] - target[1]) + Math.abs(img[p + 2] - target[2]);
          if (d < best) best = d;
          if (d <= tol) hits++;
        }
        return { best, hits };
      };
      const ores = [
        ['coal_ore', [28, 28, 30], 60],
        ['iron_ore', [206, 160, 128], 90],
        ['gold_ore', [248, 214, 66], 110],
        ['diamond_ore', [106, 230, 228], 110],
        ['redstone_ore', [202, 36, 32], 100],
        ['emerald_ore', [56, 210, 96], 110],
      ];
      for (const [name, target, tol] of ores) {
        const { best, hits } = near(name, target, tol);
        ta(hits >= 4, `${name}: contains ore color rgb(${target}) (hits=${hits}, closest l1=${best})`);
      }

      // ---- cross-shaped flowers (dandelion / poppy) ------------------------------
      const tilePixels = (name) =>
        generateTileCanvas(name).getContext('2d').getImageData(0, 0, TILE_PX, TILE_PX).data;
      const countAlpha = (data, want) => {
        let n = 0;
        for (let p = 3; p < data.length; p += 4) if (data[p] === want) n++;
        return n;
      };
      // Yellow / red hue test: count texture pixels whose dominant channel matches.
      const huePixels = (data, pick) => {
        let n = 0;
        for (let p = 0; p < data.length; p += 4) {
          if (data[p + 3] !== 255) continue;
          if (pick(data[p], data[p + 1], data[p + 2])) n++;
        }
        return n;
      };
      // Green stem pixels reaching the bottom edge (y = 15).
      const stemToBottom = (data) => {
        const p = (15 * TILE_PX + 7) * 4;
        return data[p + 3] === 255 && data[p + 1] > data[p] && data[p + 1] > data[p + 2];
      };

      const flowers = [
        ['dandelion', (r, g, b) => r > 200 && g > 170 && b < 140, 'yellow blossom'],
        ['poppy', (r, g, b) => r > 150 && g < 110 && b < 110, 'red blossom'],
      ];
      for (const [name, isBlossom, label] of flowers) {
        const px = tilePixels(name);
        const st = stats[name];
        const first = px.slice();
        const second = tilePixels(name);
        let drift = 0;
        for (let i = 0; i < first.length; i++) if (first[i] !== second[i]) drift++;
        const blossom = huePixels(px, isBlossom);

        ta(st.opaque > 8, `${name}: >8 opaque pixels (${st.opaque})`);
        ta(drift === 0, `${name}: deterministic across calls (${drift} differing bytes)`);
        ta(st.partial === 0, `${name}: no partial alpha (${st.partial})`);
        ta(st.transp > 0, `${name}: has transparent pixels (${st.transp})`);
        ta(blossom >= 2, `${name}: has a ${label} (${blossom} px)`);
        ta(stemToBottom(px), `${name}: green stem reaches the bottom-centre edge`);
        check(st.opaque + st.transp === TILE_PX * TILE_PX, `${name}: alpha must be only 0 or 255`);
      }
      ta(TEXTURE_NAMES.length === new Set(TEXTURE_NAMES).size,
        `TEXTURE_NAMES names are unique (${TEXTURE_NAMES.length} entries, ` +
        `${new Set(TEXTURE_NAMES).size} distinct)`);
      ta(TEXTURE_NAMES[TEXTURE_NAMES.length - 2] === 'dandelion' &&
         TEXTURE_NAMES[TEXTURE_NAMES.length - 1] === 'poppy',
        `TEXTURE_NAMES ends with dandelion, poppy (…${TEXTURE_NAMES.slice(-2).join(', ')})`);

      // generateTileCanvas works standalone and matches the atlas cell
      let tileCanvasOk = true;
      for (const name of TEXTURE_NAMES) {
        const c = generateTileCanvas(name);
        if (!(c instanceof HTMLCanvasElement) || c.width !== TILE_PX || c.height !== TILE_PX) {
          tileCanvasOk = false;
          check(false, `generateTileCanvas(${name}) returned a bad canvas`);
          break;
        }
        const single = c.getContext('2d').getImageData(0, 0, TILE_PX, TILE_PX).data;
        const idx = atlas.indexByName[name];
        const row = Math.floor(idx / ATLAS_COLS), col = idx % ATLAS_COLS;
        const atlasCell = ctx.getImageData(col * TILE_PX, row * TILE_PX, TILE_PX, TILE_PX).data;
        let d = 0;
        for (let i = 0; i < single.length; i++) if (single[i] !== atlasCell[i]) d++;
        if (d !== 0) {
          tileCanvasOk = false;
          check(false, `generateTileCanvas(${name}) disagrees with atlas cell by ${d} bytes`);
          break;
        }
      }
      ta(tileCanvasOk, 'generateTileCanvas matches the atlas for every tile');

      // ---- summary ---------------------------------------------------------------
      log('');
      log(`tiles=${TEXTURE_NAMES.length}`);
      log(`deterministic=${diff === 0}`);
      log(`checks_failed=${fail.length}`);
      if (fail.length) {
        for (const f of fail) log(`  FAIL: ${f}`);
        log('');
        log('RESULT: FAIL');
      } else {
        log('');
        log('RESULT: ALL CHECKS PASSED');
      }
      out.textContent = lines.join('\n');
      document.title = fail.length ? 'TEXTURE-CHECK FAIL' : 'TEXTURE-CHECK PASS';
    } catch (err) {
      log('');
      log('RESULT: ERROR');
      log(String(err && err.message ? err.message : err));
      log(String(err && err.stack ? err.stack : ''));
      out.textContent = lines.join('\n');
      document.title = 'TEXTURE-CHECK ERROR';
    }
  </script>
</body>
</html>
